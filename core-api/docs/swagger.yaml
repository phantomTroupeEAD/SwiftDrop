host: localhost:8080
info:
  contact:
    name: SwiftDrop Engineering Team
    url: https://github.com/swiftdrop
  description: Authoritative REST API Modular Monolith for SwiftDrop Courier & Parcel
    Delivery Management System.
  license:
    name: Proprietary / Academic Use Only
  termsOfService: https://swiftdrop.local/terms
  title: SwiftDrop Core API
  version: "1.0"
paths:
  /api/v1/admin/audit-logs:
    get:
      parameters:
      - default: 1
        description: Page, from 1
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page, 1-100
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.PaginatedEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.AuditRow'
                  type: array
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "403":
          description: Role is not ADMIN
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "422":
          description: 'VALIDATION_FAILED: bad page or per_page'
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit log rows, newest first (admin)
      tags:
      - admin-audit
  /api/v1/admin/dashboard:
    get:
      description: Test dashboard endpoint for authenticated Administrators.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_identity_transport.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Admin dashboard status
      tags:
      - admin
  /api/v1/admin/events/deliveries:
    get:
      description: Admin listing of outbound webhook deliveries across all merchants.
      parameters:
      - description: Delivery kind filter
        in: query
        name: kind
        type: string
      - description: Status filter
        in: query
        name: status
        type: string
      - description: Limit (1-100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.CursorPaginatedEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "403":
          description: Forbidden - Admin role required
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List all webhook deliveries (Admin)
      tags:
      - events
  /api/v1/admin/events/outbox:
    get:
      description: Queries committed outbox integration events with cursor pagination
        and status filters.
      parameters:
      - description: Filter by event status (PENDING, PUBLISHED, FAILED)
        in: query
        name: status
        type: string
      - description: Filter by event type
        in: query
        name: event_type
        type: string
      - description: RFC-3339 from timestamp
        in: query
        name: from
        type: string
      - description: RFC-3339 to timestamp
        in: query
        name: to
        type: string
      - description: Max items per page (1-100, default 25)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor for pagination
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.CursorPaginatedEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "403":
          description: Forbidden - Admin role required
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List transactional outbox events
      tags:
      - events
  /api/v1/admin/events/outbox/{id}/retry:
    post:
      description: Resets a failed outbox event status back to PENDING for re-processing.
      parameters:
      - description: Event UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "404":
          description: Event not found
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "409":
          description: Event is not in FAILED state
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Retry a failed outbox event
      tags:
      - events
  /api/v1/admin/events/outbox/stats:
    get:
      description: Returns counts of outbox events by status (pending, published,
        failed).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "403":
          description: Forbidden - Admin role required
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get outbox queue statistics
      tags:
      - events
  /api/v1/admin/events/webhook-deliveries/{id}/retry:
    post:
      description: Resets a failed webhook delivery to PENDING to trigger retry.
      parameters:
      - description: Delivery UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "404":
          description: Delivery not found
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "409":
          description: Delivery not in FAILED state
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Retry failed webhook delivery
      tags:
      - events
  /api/v1/admin/reports/deliveries:
    get:
      parameters:
      - description: Start date, YYYY-MM-DD
        in: query
        name: from
        required: true
        type: string
      - description: End date, YYYY-MM-DD
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.DeliveryReport'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "403":
          description: Role is not ADMIN or DISPATCHER
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "422":
          description: 'VALIDATION_FAILED: bad dates or range too long'
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delivery report for a date range (admin, dispatcher)
      tags:
      - admin-reports
  /api/v1/admin/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.Setting'
                  type: array
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "403":
          description: Role is not ADMIN
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List system settings (admin)
      tags:
      - admin-settings
  /api/v1/admin/settings/{key}:
    put:
      consumes:
      - application/json
      parameters:
      - description: reports.max_range_days, ops.board_refresh_seconds, ops.maintenance_banner,
          parcels.max_weight_kg or parcels.max_cod_cents
        in: path
        name: key
        required: true
        type: string
      - description: value, current version and a 10-500 char reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.SettingInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.Setting'
              type: object
        "400":
          description: 'BAD_REQUEST: malformed JSON'
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "403":
          description: Role is not ADMIN
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "409":
          description: CONCURRENT_MODIFICATION
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "422":
          description: SETTING_UNKNOWN, REASON_REQUIRED or VALIDATION_FAILED
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change one system setting (admin)
      tags:
      - admin-settings
  /api/v1/admin/zones:
    get:
      parameters:
      - default: 1
        description: Page, from 1
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page, 1-100
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.PaginatedEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.ZoneView'
                  type: array
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "403":
          description: Role is not ADMIN
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "422":
          description: 'VALIDATION_FAILED: bad page or per_page'
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List delivery zones (admin)
      tags:
      - admin-zones
    post:
      consumes:
      - application/json
      parameters:
      - description: New zone
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.CreateZoneInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.ZoneView'
              type: object
        "400":
          description: 'BAD_REQUEST: malformed JSON'
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "403":
          description: Role is not ADMIN
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "409":
          description: ZONE_CODE_ALREADY_EXISTS or ZONE_POSTAL_CODE_CONFLICT
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a delivery zone (admin)
      tags:
      - admin-zones
  /api/v1/admin/zones/{id}:
    get:
      parameters:
      - description: Zone id, e.g. ZONE_COLOMBO_01
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.ZoneView'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "403":
          description: Role is not ADMIN
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get one delivery zone (admin)
      tags:
      - admin-zones
    patch:
      consumes:
      - application/json
      parameters:
      - description: Zone id
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change plus current version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.UpdateZoneInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.ZoneView'
              type: object
        "400":
          description: 'BAD_REQUEST: malformed JSON'
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "403":
          description: Role is not ADMIN
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "409":
          description: CONCURRENT_MODIFICATION, ZONE_CODE_ALREADY_EXISTS or ZONE_POSTAL_CODE_CONFLICT
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Edit a delivery zone (admin)
      tags:
      - admin-zones
  /api/v1/admin/zones/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Zone id
        in: path
        name: id
        required: true
        type: string
      - description: enabled, current version and a 10-500 char reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.StatusInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.ZoneView'
              type: object
        "400":
          description: 'BAD_REQUEST: malformed JSON'
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "403":
          description: Role is not ADMIN
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "409":
          description: CONCURRENT_MODIFICATION
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "422":
          description: VALIDATION_FAILED or REASON_REQUIRED
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Enable or disable a delivery zone (admin)
      tags:
      - admin-zones
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Validates credentials and returns access token and HttpOnly refresh
        token cookie.
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_identity_transport.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_identity_transport.SingleDataEnvelope'
        "400":
          description: Malformed JSON or validation error
          schema:
            $ref: '#/definitions/internal_identity_transport.ErrorEnvelope'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/internal_identity_transport.ErrorEnvelope'
        "403":
          description: Account has been suspended
          schema:
            $ref: '#/definitions/internal_identity_transport.ErrorEnvelope'
        "500":
          description: Authentication failed due to internal error
          schema:
            $ref: '#/definitions/internal_identity_transport.ErrorEnvelope'
      summary: Authenticate user and issue JWT
      tags:
      - identity
  /api/v1/auth/me:
    get:
      description: Returns user profile and tenant details for the authenticated bearer
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_identity_transport.SingleDataEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_identity_transport.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get authenticated user profile
      tags:
      - identity
  /api/v1/courier/dashboard:
    get:
      description: Test dashboard endpoint for authenticated Couriers and Admins.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_identity_transport.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Courier dashboard status
      tags:
      - admin
  /api/v1/health:
    get:
      description: Returns general operational status and storage engine info.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: System health status
      tags:
      - system
  /api/v1/merchant/orders:
    get:
      description: Returns orders submitted by the authenticated merchant tenant.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.PaginatedEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List merchant parcel delivery orders
      tags:
      - merchants
    post:
      consumes:
      - application/json
      description: Creates an order using API Key or JWT authentication. Requires
        Idempotency-Key.
      parameters:
      - description: UUID v4 Idempotency Key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Order details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_swiftdrop_core-api_internal_merchants_application.OrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "400":
          description: Validation error or missing idempotency key
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "401":
          description: Unauthorized or missing credentials
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new parcel delivery order
      tags:
      - merchants
  /api/v1/merchant/portal:
    get:
      description: Test portal endpoint for authenticated Merchants and Admins with
        active tenant.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_identity_transport.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Merchant portal status
      tags:
      - admin
  /api/v1/merchant/webhook-deliveries:
    get:
      description: Returns webhook delivery history for the authenticated merchant
        tenant.
      parameters:
      - description: Limit (1-100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.CursorPaginatedEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List merchant webhook deliveries
      tags:
      - events
  /api/v1/merchant/webhook-deliveries/{id}/attempts:
    get:
      description: Returns attempt details (response codes, latency) for a specific
        delivery.
      parameters:
      - description: Delivery UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "404":
          description: Delivery not found or not owned by merchant
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List attempts for a webhook delivery
      tags:
      - events
  /api/v1/merchants/applications:
    post:
      consumes:
      - application/json
      description: Submits a merchant profile for review and tenant onboarding.
      parameters:
      - description: Merchant Application
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_swiftdrop_core-api_internal_merchants_application.ApplicationInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "400":
          description: Malformed JSON
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "409":
          description: Merchant already exists
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit a new merchant onboarding application
      tags:
      - merchants
  /api/v1/merchants/me:
    get:
      description: Returns the profile of the merchant tenant tied to the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "404":
          description: Merchant not found
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current merchant profile
      tags:
      - merchants
  /api/v1/merchants/me/api-keys:
    get:
      description: Returns all API credentials for the authenticated merchant tenant.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List active merchant API keys
      tags:
      - merchants
    post:
      consumes:
      - application/json
      description: Generates an API credential with scoped permissions. Key secret
        is returned once only.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "400":
          description: Malformed JSON
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate a new merchant API key
      tags:
      - merchants
  /api/v1/merchants/me/api-keys/{key_id}:
    delete:
      description: Immediately invalidates the specified API key credential.
      parameters:
      - description: API Key ID
        in: path
        name: key_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "404":
          description: API key not found
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an active merchant API key
      tags:
      - merchants
  /api/v1/merchants/me/webhooks:
    get:
      description: Returns all registered webhook subscriptions for the authenticated
        merchant.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List registered webhooks
      tags:
      - merchants
    post:
      consumes:
      - application/json
      description: Configures a webhook endpoint to receive domain notification events.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "400":
          description: Malformed JSON or user-supplied secret forbidden
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a new webhook subscription
      tags:
      - merchants
  /api/v1/merchants/me/webhooks/{webhook_id}:
    delete:
      description: Removes an existing webhook subscription by its ID.
      parameters:
      - description: Webhook ID
        in: path
        name: webhook_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "404":
          description: Webhook not found
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a webhook subscription
      tags:
      - merchants
  /api/v1/merchants/webhook-event-types:
    get:
      description: Returns the catalog of event types merchants can subscribe to.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
      security:
      - BearerAuth: []
      summary: List supported webhook event types
      tags:
      - merchants
  /api/v1/pricing/quotes:
    post:
      consumes:
      - application/json
      description: Evaluates geographic tariffs, volumetric weight, and service level
        multipliers to generate a 15-minute price-frozen quote scoped to the authenticated
        customer, merchant, or admin.
      parameters:
      - description: Pricing quote request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transport.CreateQuoteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Generated pricing quote wrapped in standard data envelope
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
        "400":
          description: Malformed JSON body or disallowed fields
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "401":
          description: Missing or invalid Bearer token
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "403":
          description: Forbidden role, missing/invalid tenant UUID, owner mismatch,
            or unapproved merchant
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "413":
          description: Request body exceeds size limit
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "415":
          description: Unsupported Content-Type
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "422":
          description: Semantic validation failure or no applicable tariff available
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
        "500":
          description: Internal quote generation or verification failure
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Calculate and persist a delivery pricing quote
      tags:
      - pricing
  /api/v1/zones:
    get:
      parameters:
      - description: 5-digit postal code; returns the one matching zone
        in: query
        name: postal_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.DataEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_swiftdrop_core-api_internal_admin_application.PublicZone'
                  type: array
              type: object
        "404":
          description: 'ZONE_NOT_FOUND: no zone covers this postal code'
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
        "422":
          description: 'VALIDATION_FAILED: postal_code must be 5 digits'
          schema:
            $ref: '#/definitions/github_com_swiftdrop_core-api_internal_platform_httpx.ErrorResponse'
      summary: List enabled zones, or find the zone of a postal code (public)
      tags:
      - zones
  /health/live:
    get:
      description: Probes whether the Core API service process is alive.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Kubernetes liveness probe
      tags:
      - system
  /health/ready:
    get:
      description: Probes whether the Core API service is ready to accept traffic
        (verifies database connectivity).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Database unreachable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Kubernetes readiness probe
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token (e.g. 'Bearer eyJhbGci...').
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
