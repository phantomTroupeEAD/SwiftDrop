# Non-secret settings for core-api (environment-variables.md section 7: core-api-config).
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-api-config
  namespace: swiftdrop
  labels: {app.kubernetes.io/name: core-api, app.kubernetes.io/part-of: swiftdrop}
data:
  APP_ENV: "production"
  HTTP_ADDR: ":8080"
  LOG_LEVEL: "info"
  # 4 replicas x 20 = 80 connections, below PostgreSQL max_connections 100 (deploy/README 5.1)
  DB_MAX_OPEN_CONNS: "20"
  DB_MAX_IDLE_CONNS: "5"
  DB_STATEMENT_TIMEOUT_MS: "3000"
  ADMIN_LOCK_TIMEOUT_MS: "2000"
  JWT_ISSUER: "https://api.swiftdrop.example.com"   # placeholder domain (U-09)
  JWT_PUBLIC_KEY_PEM: "/run/keys/jwt_public.pem"
  HTTP_REQUEST_TIMEOUT_SECONDS: "25"
  SHUTDOWN_GRACE_SECONDS: "20"
  READINESS_DRAIN_SECONDS: "5"
  GOMEMLIMIT: "200MiB"   # Go frees memory before the 256Mi container limit is hit
