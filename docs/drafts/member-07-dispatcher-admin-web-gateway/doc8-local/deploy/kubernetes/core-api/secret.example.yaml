# EXAMPLE ONLY. Never commit real values. Create the real Secret with:
#   kubectl -n swiftdrop create secret generic postgres-credentials \
#     --from-literal=DATABASE_URL='postgres://swiftdrop_app:<password>@postgres-0.postgres-headless:5432/swiftdrop_db?sslmode=require'
#   kubectl -n swiftdrop create secret generic jwt-public-key --from-file=jwt_public.pem
# Member 1 owns jwt-secrets (private key); core-api's admin part needs only the PUBLIC key.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: swiftdrop
type: Opaque
stringData:
  DATABASE_URL: "postgres://swiftdrop_app:CHANGE_ME@postgres-0.postgres-headless:5432/swiftdrop_db?sslmode=require"
