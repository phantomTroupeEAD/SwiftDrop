# EXAMPLE ONLY. Never commit real values. Secret names follow Member 9 agreement A5:
#   kubectl -n swiftdrop create secret generic postgres-secrets \
#     --from-literal=DATABASE_URL='postgres://swiftdrop_app:<password>@postgres-0.postgres-headless:5432/swiftdrop_db?sslmode=disable'
#   kubectl -n swiftdrop create secret generic postgres-migrator-secrets \
#     --from-literal=MIGRATE_DATABASE_URL='postgres://swiftdrop_migrator:<password>@postgres-0.postgres-headless:5432/swiftdrop_db?sslmode=disable'
#   kubectl -n swiftdrop create secret generic jwt-public-key --from-file=jwt_public.pem
# sslmode=disable is the agreed setting inside the cluster (alignment guide 3.5).
# Member 1 owns jwt-secrets (private key); core-api's admin part needs only the PUBLIC key.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: swiftdrop
type: Opaque
stringData:
  DATABASE_URL: "postgres://swiftdrop_app:CHANGE_ME@postgres-0.postgres-headless:5432/swiftdrop_db?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-migrator-secrets
  namespace: swiftdrop
type: Opaque
stringData:
  MIGRATE_DATABASE_URL: "postgres://swiftdrop_migrator:CHANGE_ME@postgres-0.postgres-headless:5432/swiftdrop_db?sslmode=disable"
