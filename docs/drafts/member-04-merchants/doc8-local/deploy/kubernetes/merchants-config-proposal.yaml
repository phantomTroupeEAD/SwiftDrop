# PROPOSAL for Member 9 — what the merchants module needs in the shared core-api Deployment.
# Not a complete Deployment: Member 9 owns deploy/kubernetes/. Merge these pieces into theirs.
# Namespace and names follow docs/operations/deployment-guide.md (namespace swiftdrop, deployment core-api).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-api-merchants-config
  namespace: swiftdrop
  labels: { app: core-api, module: merchants }
data:
  MERCHANT_API_KEY_PREFIX: "sd_live_"              # sd_test_ in non-production clusters
  MERCHANT_API_KEY_PEPPER_VERSION: "1"
  WEBHOOK_SECRET_KEY_VERSION: "1"
  WEBHOOK_ALLOW_HTTP: "false"                      # config refuses true outside APP_ENV=local
  MERCHANT_MAX_ACTIVE_KEYS: "5"
  WEBHOOK_MAX_ENDPOINTS_PER_MERCHANT: "10"
  SHUTDOWN_DRAIN_SECONDS: "5"                      # > readiness period so endpoints are removed first
  SHUTDOWN_TIMEOUT_SECONDS: "20"
---
# Secrets: no merchants-specific Secret. Member 9 owns the shared integrations-secrets
# (docs/operations/environment-variables.md), which must contain these two keys for core-api:
#   MERCHANT_API_KEY_PEPPER        head -c 48 /dev/urandom | base64
#   WEBHOOK_SECRET_ENCRYPTION_KEY  head -c 32 /dev/urandom | base64
# Member 8's Event Worker mounts the same Secret: it needs the SAME WEBHOOK_SECRET_ENCRYPTION_KEY
# to decrypt signing secrets (U-22).
---
# Fragment to merge into Member 9's core-api Deployment spec.template.spec.containers[core-api]:
#
#   envFrom:
#     - configMapRef: { name: core-api-config }              # existing (APP_ENV, HTTP_ADDR, ...)
#     - configMapRef: { name: core-api-merchants-config }    # new
#     - secretRef:    { name: integrations-secrets }         # Member 9's shared Secret
#   ports: [{ name: http, containerPort: 8080 }]
#   livenessProbe:  { httpGet: { path: /livez,  port: http }, periodSeconds: 10, failureThreshold: 3 }
#   readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 3,  failureThreshold: 1 }
#   startupProbe:   { httpGet: { path: /livez,  port: http }, periodSeconds: 2,  failureThreshold: 15 }
#   securityContext:
#     runAsNonRoot: true
#     runAsUser: 10001
#     readOnlyRootFilesystem: true
#     allowPrivilegeEscalation: false
#     capabilities: { drop: [ALL] }
#   resources:                       # merchants adds little to core-api; measured image 31 MB
#     requests: { cpu: 100m, memory: 64Mi }
#     limits:   { memory: 256Mi }
# terminationGracePeriodSeconds: 30  # >= SHUTDOWN_DRAIN_SECONDS + SHUTDOWN_TIMEOUT_SECONDS
---
# Egress from core-api: merchants resolves webhook hostnames (DNS) at registration time but
# never connects to merchant URLs (Member 8 does). Allow DNS; no extra egress needed for this module.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: core-api-merchants-dns-egress
  namespace: swiftdrop
spec:
  podSelector: { matchLabels: { app: core-api } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
