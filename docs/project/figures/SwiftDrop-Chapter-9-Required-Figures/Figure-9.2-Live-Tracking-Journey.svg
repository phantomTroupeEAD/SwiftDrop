text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">Yes</text><polyline points="1090,1477.3015873015872 1330,1481.111111111111" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arr)"/><rect x="1202.2" y="1453.2063492063492" width="15.6" height="24" fill="white" opacity=".96"/><text x="1210" y="1465.2063492063492" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">No</text><polyline points="1575,1540 1575,1640" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arr)"/><polyline points="700,1690 640,1690 640,1015 925,1015 925,1040" fill="none" stroke="#52647b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="581" y="1548" width="78" height="24" fill="white" opacity=".96"/><text x="620" y="1560" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">Resume SSE</text><polyline points="1820,1690 1860,1690 1860,1485 1820,1485" fill="none" stroke="#52647b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="1572" y="1568" width="156" height="24" fill="white" opacity=".96"/><text x="1650" y="1580" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">Repeat while mounted</text><polyline points="1070,1095 1280,1095 1280,1800 925,1800 925,1830" fill="none" stroke="#52647b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="1374.7" y="1778" width="210.6" height="43" fill="white" opacity=".96"/><text x="1480" y="1789.4" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">Navigation away at any</text><text x="1480" y="1808.6000000000001" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">time</text><polyline points="925,1900 925,1950" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arr)"/><polyline points="1330,1485 1240,1485 1240,1475 1090,1475" fill="none" stroke="#52647b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="1186.9" y="1368" width="226.2" height="43" fill="white" opacity=".96"/><text x="1300" y="1379.4" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">Retry stream when</text><text x="1300" y="1398.6000000000001" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">appropriate</text><ellipse cx="925" cy="215" rx="325" ry="45" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="925" y="204.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Visitor enters tracking number</text><text x="925" y="225.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">or opens /track/:trackingNumber</text><rect x="600" y="330" width="650" height="100" rx="8" fill="#e8f0ff" stroke="#3569ba" stroke-width="2"/><text x="925" y="369.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Show loading state</text><text x="925" y="390.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">GET public tracking via gateway</text><polygon points="925,490 1070,545 925,600 780,545" fill="#fff7d8" stroke="#ae882b" stroke-width="2"/><text x="925" y="545" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#233247">Lookup result?</text><rect x="70" y="490" width="440" height="110" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="290" y="534.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">404: tracking number not found</text><text x="290" y="555.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Check number and try again</text><rect x="1390" y="490" width="440" height="110" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="1610" y="534.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Network / service unavailable</text><text x="1610" y="555.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Show retry option, not “not found”</text><rect x="600" y="680" width="650" height="100" rx="8" fill="#e7f5ec" stroke="#31845a" stroke-width="2"/><text x="925" y="719.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Show privacy-safe current status and timeline</text><text x="925" y="740.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Display unfamiliar statuses safely</text><rect x="600" y="860" width="650" height="100" rx="8" fill="#e8f0ff" stroke="#3569ba" stroke-width="2"/><text x="925" y="899.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Open SSE subscription through gateway</text><text x="925" y="920.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Show connecting / connected state</text><polygon points="925,1040 1070,1095 925,1150 780,1095" fill="#fff7d8" stroke="#ae882b" stroke-width="2"/><text x="925" y="1095" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#233247">Connection event?</text><rect x="70" y="1220" width="490" height="110" rx="8" fill="#e7f5ec" stroke="#31845a" stroke-width="2"/><text x="315" y="1264.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Change notification received</text><text x="315" y="1285.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Refetch authoritative tracking state</text><rect x="70" y="1430" width="490" height="110" rx="8" fill="#e7f5ec" stroke="#31845a" stroke-width="2"/><text x="315" y="1474.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Render latest current state / timeline</text><text x="315" y="1495.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Do not invent lifecycle transitions</text><rect x="700" y="1220" width="490" height="110" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="945" y="1264.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Connection lost: show reconnecting</text><text x="945" y="1285.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Keep previous data visibly stale</text><polygon points="945,1420 1090,1475 945,1530 800,1475" fill="#fff7d8" stroke="#ae882b" stroke-width="2"/><text x="945" y="1475" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#233247">Stream restored?</text><rect x="1330" y="1430" width="490" height="110" rx="8" fill="#e8f0ff" stroke="#3569ba" stroke-width="2"/><text x="1575" y="1474.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Stream unavailable: bounded polling</text><text x="1575" y="1495.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Show polling / disconnected status</text><rect x="700" y="1640" width="490" height="100" rx="8" fill="#e7f5ec" stroke="#31845a" stroke-width="2"/><text x="945" y="1679.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">On reconnect: refetch current state</text><text x="945" y="1700.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Then resume live notifications</text><rect x="1330" y="1640" width="490" height="100" rx="8" fill="#e8f0ff" stroke="#3569ba" stroke-width="2"/><text x="1575" y="1679.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Poll current tracking state through gateway</text><text x="1575" y="1700.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Update data on success; show failure safely</text><ellipse cx="925" cy="1865" rx="325" ry="35" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="925" y="1865" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Visitor leaves tracking page</text><rect x="600" y="1950" width="650" height="90" rx="8" fill="#e8f0ff" stroke="#3569ba" stroke-width="2"/><text x="925" y="1984.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Close EventSource and stop polling timers</text><text x="925" y="2005.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Cancel outstanding work on unmount</text><rect x="40" y="2118" width="1820" height="74" rx="8" fill="#f3f6fa"/><text x="60" y="2155" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#233247">Public lookup requires no sign-in and must hide private contacts, street addresses and proof attachments. SSE event policy and polling timing remain TBC with M5.</text><text x="1850" y="2210" text-anchor="end" font-size="12" fill="#687588">Proposed design · 01 Nov 2026 · Contracts marked TBC require owner confirmation</text></g></svg>