47b" stroke-width="2" marker-end="url(#arr)"/><polyline points="620,1980 290,1980 290,2050" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arr)"/><rect x="258.8" y="1989" width="62.4" height="24" fill="white" opacity=".96"/><text x="290" y="2001" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">Accepted</text><polyline points="803.3333333333334,2030 816.6666666666666,2050" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arr)"/><rect x="778.8" y="2014" width="62.4" height="24" fill="white" opacity=".96"/><text x="810" y="2026" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">Rejected</text><polyline points="920,1980 1280,1980" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#arr)"/><rect x="1072.7" y="1954" width="54.6" height="24" fill="white" opacity=".96"/><text x="1100" y="1966" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">Timeout</text><polyline points="1505,1860 1505,1820 1120,1820" fill="none" stroke="#52647b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="1254" y="1794" width="117" height="24" fill="white" opacity=".96"/><text x="1312.5" y="1806" text-anchor="middle" dominant-baseline="middle" font-size="15" fill="#233247">Unchanged retry</text><ellipse cx="770" cy="185" rx="350" ry="35" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="770" y="185" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Signed-in customer opens booking wizard</text><rect x="420" y="330" width="700" height="80" rx="8" fill="#e7f5ec" stroke="#31845a" stroke-width="2"/><text x="770" y="370" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Enter pickup contact and address</text><polygon points="770,440 920,485 770,530 620,485" fill="#fff7d8" stroke="#ae882b" stroke-width="2"/><text x="770" y="485" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#233247">Pickup valid?</text><rect x="1330" y="350" width="380" height="100" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="1520" y="389.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Show field errors</text><text x="1520" y="410.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Keep entered values</text><rect x="420" y="670" width="700" height="80" rx="8" fill="#e7f5ec" stroke="#31845a" stroke-width="2"/><text x="770" y="710" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Enter recipient contact and delivery address</text><polygon points="770,780 920,825 770,870 620,825" fill="#fff7d8" stroke="#ae882b" stroke-width="2"/><text x="770" y="825" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#233247">Delivery valid?</text><rect x="1330" y="690" width="380" height="100" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="1520" y="729.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Show field errors</text><text x="1520" y="750.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Keep entered values</text><rect x="420" y="1010" width="700" height="100" rx="8" fill="#e7f5ec" stroke="#31845a" stroke-width="2"/><text x="770" y="1049.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Enter weight, dimensions and service</text><text x="770" y="1070.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Validate supported inputs; request server quote</text><polygon points="770,1160 920,1210 770,1260 620,1210" fill="#fff7d8" stroke="#ae882b" stroke-width="2"/><text x="770" y="1210" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#233247">Quote available?</text><rect x="1330" y="1020" width="380" height="110" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="1520" y="1064.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Show quote / validation error</text><text x="1520" y="1085.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Edit inputs and request again</text><rect x="420" y="1440" width="700" height="100" rx="8" fill="#e7f5ec" stroke="#31845a" stroke-width="2"/><text x="770" y="1479.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Show contacts, addresses, parcel details</text><text x="770" y="1500.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Price + currency + quote expiry</text><polygon points="770,1580 920,1630 770,1680 620,1630" fill="#fff7d8" stroke="#ae882b" stroke-width="2"/><text x="770" y="1619.76" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#233247">Quote current and</text><text x="770" y="1640.24" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#233247">inputs unchanged?</text><rect x="1330" y="1430" width="380" height="120" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="1520" y="1468.24" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Inputs changed or quote expired</text><text x="1520" y="1490" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Return to Step 3; get new quote</text><text x="1520" y="1511.76" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Review again before confirming</text><rect x="420" y="1780" width="700" height="100" rx="8" fill="#e8f0ff" stroke="#3569ba" stroke-width="2"/><text x="770" y="1819.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Customer confirms → submit booking</text><text x="770" y="1840.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Stable Idempotency-Key; disable duplicate clicks</text><polygon points="770,1930 920,1980 770,2030 620,1980" fill="#fff7d8" stroke="#ae882b" stroke-width="2"/><text x="770" y="1980" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#233247">Backend outcome?</text><rect x="60" y="2050" width="460" height="100" rx="8" fill="#e7f5ec" stroke="#31845a" stroke-width="2"/><text x="290" y="2089.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Accepted: show tracking number</text><text x="290" y="2110.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Links to tracking, history and receipt</text><rect x="620" y="2050" width="460" height="100" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="850" y="2089.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Rejected: preserve values</text><text x="850" y="2110.88" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Correct the affected step</text><rect x="1280" y="1860" width="450" height="150" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="1505" y="1913.24" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Timeout: outcome uncertain</text><text x="1505" y="1935" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Same payload → SAME key</text><text x="1505" y="1956.76" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Edited payload → NEW key + re-quote</text><rect x="80" y="1810" width="290" height="120" rx="8" fill="#f0f2f5" stroke="#687588" stroke-width="2"/><text x="225" y="1837.36" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Back navigation preserves</text><text x="225" y="1859.12" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">form input.</text><text x="225" y="1880.8799999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">Changing quote inputs</text><text x="225" y="1902.6399999999999" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#233247">invalidates the old quote.</text><rect x="40" y="2218" width="1720" height="74" rx="8" fill="#f3f6fa"/><text x="60" y="2255" text-anchor="start" dominant-baseline="middle" font-size="15" fill="#233247">Proposed four-screen grouping: pickup → delivery → parcel / quote → review / confirm. Field requirements follow Core API Parcel &amp; Pricing Engine contracts. Success requires backend confirmation.</text><text x="1750" y="2310" text-anchor="end" font-size="12" fill="#687588">Authoritative Baseline Architecture · 01 Nov 2026 · Verified Client Interaction Design</text></g></svg>