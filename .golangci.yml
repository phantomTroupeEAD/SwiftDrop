run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - gosec
    - depguard
    - misspell
    - ineffassign

linters-settings:
  depguard:
    rules:
      domain_purity:
        files:
          - "**/internal/**/domain/**.go"
        deny:
          - pkg: "net/http"
            desc: "Domain layer must not import transport or HTTP packages."
          - pkg: "database/sql"
            desc: "Domain layer must not import raw SQL packages. Use repository interfaces."
          - pkg: "github.com/rabbitmq/amqp091-go"
            desc: "Domain layer must not import messaging infrastructure."
          - pkg: "**/internal/**/infrastructure/**"
            desc: "Domain layer must not import infrastructure implementations."
          - pkg: "**/internal/**/transport/**"
            desc: "Domain layer must not import transport implementations."

      application_purity:
        files:
          - "**/internal/**/application/**.go"
        deny:
          - pkg: "net/http"
            desc: "Application use cases must remain decoupled from HTTP handlers."
          - pkg: "**/internal/**/transport/**"
            desc: "Application layer must not import transport DTOs."

      platform_isolation:
        files:
          - "**/internal/platform/**.go"
        deny:
          - pkg: "**/internal/identity/**"
            desc: "Platform packages must not depend on domain modules."
          - pkg: "**/internal/parcels/**"
            desc: "Platform packages must not depend on domain modules."
          - pkg: "**/internal/pricing/**"
            desc: "Platform packages must not depend on domain modules."
          - pkg: "**/internal/dispatch/**"
            desc: "Platform packages must not depend on domain modules."
          - pkg: "**/internal/delivery/**"
            desc: "Platform packages must not depend on domain modules."
          - pkg: "**/internal/merchants/**"
            desc: "Platform packages must not depend on domain modules."
          - pkg: "**/internal/admin/**"
            desc: "Platform packages must not depend on domain modules."
          - pkg: "**/internal/events/**"
            desc: "Platform packages must not depend on domain modules."

      core_api_no_broker:
        files:
          - "**/core-api/**/*.go"
        deny:
          - pkg: "github.com/rabbitmq/amqp091-go"
            desc: "Core API must not publish to the broker; use the outbox."

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - revive
    - path: (wiring\.go|jwt_token_provider\.go)
      text: "G101"
      linters:
        - gosec
