version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: swiftdrop-dev-postgres
    environment:
      POSTGRES_DB: swiftdrop_db
      POSTGRES_USER: swiftdrop_user
      POSTGRES_PASSWORD: swiftdrop_password
    ports:
      - "5432:5432"
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftdrop_user -d swiftdrop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: swiftdrop-dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - dev-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: swiftdrop-dev-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: ""

volumes:
  dev-postgres-data:
  dev-rabbitmq-data:

