[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftdrop-ai-assistant"
version = "2.5.1"
description = "SwiftDrop AI Delivery Assistant & Model Context Protocol (FastMCP) Service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Member 10 — AI Assistant & Cross-Workflow Quality", email = "member10@swiftdrop.local" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
