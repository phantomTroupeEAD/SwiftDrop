name: SwiftDrop CI Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  go-checks:
    name: Core API Quality & Architecture Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: false

      - name: Check Formatting (gofmt)
        run: |
          if [ -d "core-api" ] || [ -f "go.mod" ]; then
            UNFORMATTED=$(gofmt -l $(find core-api -name "*.go" -not -path "*/vendor/*" 2>/dev/null) 2>/dev/null || true)
            if [ -n "$UNFORMATTED" ]; then
              echo "Error: Unformatted Go files found:"
              echo "$UNFORMATTED"
              exit 1
            fi
          fi

      - name: Run golangci-lint (with depguard)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ hashFiles('core-api/go.mod') != '' && 'core-api' || '.' }}
          args: --timeout=5m
        if: hashFiles('**/go.mod') != ''

      - name: Run Tests (-race)
        run: |
          if [ -d "core-api" ]; then
            cd core-api && go test -v -race ./...
          elif [ -f "go.mod" ]; then
            go test -v -race ./...
          fi
        if: hashFiles('**/go.mod') != ''

  messaging-checks:
    name: Messaging Service Quality & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/messaging/go.mod'
          check-latest: true
          cache: false

      - name: Check Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l $(find services/messaging -name "*.go" -not -path "*/vendor/*" 2>/dev/null) 2>/dev/null || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: |
          cd services/messaging && go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/messaging
          args: --timeout=5m

      - name: Run Tests (-race)
        run: |
          cd services/messaging && go test -v -race ./...
