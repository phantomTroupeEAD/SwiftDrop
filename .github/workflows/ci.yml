name: SwiftDrop CI Quality Gates

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  go-checks:
    name: Go Quality & Architecture Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: false

      # Go jobs key on core-api/go.mod only: the draft go.mod files under docs/drafts/ must not trigger them
      - name: Check Formatting (gofmt)
        if: hashFiles('core-api/go.mod') != ''
        run: |
          UNFORMATTED=$(gofmt -l $(find core-api -name "*.go" -not -path "*/vendor/*" 2>/dev/null) 2>/dev/null || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint (with depguard)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: core-api
          args: --timeout=5m
        if: hashFiles('core-api/go.mod') != ''

      - name: Run Tests (-race)
        run: cd core-api && go test -v -race ./...
        if: hashFiles('core-api/go.mod') != ''

  messaging-checks:
    name: Messaging Service Quality & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'services/messaging/go.mod'
          check-latest: true
          cache: false

      - name: Check Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l $(find services/messaging -name "*.go" -not -path "*/vendor/*" 2>/dev/null) 2>/dev/null || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go Vet
        run: |
          cd services/messaging && go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/messaging
          args: --timeout=5m

      - name: Run Tests (-race)
        run: |
          cd services/messaging && go test -v -race ./...

  tracking-checks:
    name: Tracking Service Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'services/tracking/go.mod'
          check-latest: true

      - name: Run Tests (-race)
        run: cd services/tracking && go test -v -race ./...

  ai-assistant-checks:
    name: AI Assistant Quality & Tests (Unit, API & E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/ai-assistant/requirements.txt'

      - name: Install Dependencies & Run All Tests
        run: |
          pip install -r services/ai-assistant/requirements.txt
          cd services/ai-assistant && python -m pytest tests -v

  web-checks:
    name: Web Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install & Build
        run: cd web && npm ci && npm run build
