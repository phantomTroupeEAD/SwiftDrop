name: SwiftDrop CI Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  go-checks:
    name: Go Quality & Architecture Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: false

      # Go jobs key on core-api/go.mod only: the draft go.mod files under docs/drafts/ must not trigger them
      - name: Check Formatting (gofmt)
        if: hashFiles('core-api/go.mod') != ''
        run: |
          UNFORMATTED=$(gofmt -l $(find core-api -name "*.go" -not -path "*/vendor/*" 2>/dev/null) 2>/dev/null || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files found:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint (with depguard)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: core-api
          args: --timeout=5m
        if: hashFiles('core-api/go.mod') != ''

      - name: Run Tests (-race)
        run: cd core-api && go test -v -race ./...
        if: hashFiles('core-api/go.mod') != ''
