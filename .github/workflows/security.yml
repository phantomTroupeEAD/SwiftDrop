name: SwiftDrop Security & Vulnerability Gates

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Run every Sunday at midnight UTC for proactive CVE alerts
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-verification:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          extra_args: --only-verified

  govulncheck-scan:
    name: Go Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan core-api
        run: |
          cd core-api
          govulncheck ./... || echo "::warning title=Core API Vulnerabilities::Vulnerabilities detected in core-api dependencies"

      - name: Scan services/messaging
        run: |
          cd services/messaging
          govulncheck ./... || echo "::warning title=Messaging Vulnerabilities::Vulnerabilities detected in messaging dependencies"

      - name: Scan services/tracking
        run: |
          cd services/tracking
          govulncheck ./... || echo "::warning title=Tracking Vulnerabilities::Vulnerabilities detected in tracking dependencies"

  npm-audit-scan:
    name: Node & Frontend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Audit web frontend
        run: |
          cd web
          npm audit --audit-level=high || echo "::warning title=Web Audit::High severity npm advisories found in web dependencies"

      - name: Audit tests/e2e
        run: |
          cd tests/e2e
          npm audit --audit-level=high || echo "::warning title=E2E Audit::High severity npm advisories found in tests/e2e dependencies"

  trivy-repo-scan:
    name: Trivy Repository & Filesystem CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
