apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: swiftdrop
type: Opaque
stringData:
  POSTGRES_USER: "swiftdrop"
  POSTGRES_PASSWORD: "change_me_super_secret_db_password"
  POSTGRES_DB: "swiftdrop_db"
  # Per-role application connection strings (Decision D6)
  MIGRATOR_DATABASE_URL: "postgres://swiftdrop_migrator:change_me_migrator_pw@postgres:5432/swiftdrop_db?sslmode=disable"
  APP_DATABASE_URL: "postgres://swiftdrop_app:change_me_app_pw@postgres:5432/swiftdrop_db?sslmode=disable"
  RELAY_DATABASE_URL: "postgres://swiftdrop_relay:change_me_relay_pw@postgres:5432/swiftdrop_db?sslmode=disable"
  WORKER_DATABASE_URL: "postgres://swiftdrop_worker:change_me_worker_pw@postgres:5432/swiftdrop_db?sslmode=disable"
  RECONCILER_DATABASE_URL: "postgres://swiftdrop_reconciler:change_me_reconciler_pw@postgres:5432/swiftdrop_db?sslmode=disable"
  TRACKING_DATABASE_URL: "postgres://swiftdrop_tracking_ro:change_me_tracking_pw@postgres:5432/swiftdrop_db?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: swiftdrop
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "swiftdrop"
  RABBITMQ_DEFAULT_PASS: "change_me_rabbitmq_secret_password"
  RABBITMQ_URL: "amqp://swiftdrop:change_me_rabbitmq_secret_password@rabbitmq:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: core-api-secrets
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: swiftdrop
type: Opaque
stringData:
  JWT_SECRET: "change_me_minimum_32_character_jwt_hmac_secret_key"
  MERCHANT_API_KEY_PEPPER: "change_me_merchant_api_key_pepper_secret_token"
  # Base64 of 32 random bytes: openssl rand -base64 32
  # The worker's integrations-secrets must hold the SAME bytes as 64 hex chars.
  WEBHOOK_SECRET_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="

