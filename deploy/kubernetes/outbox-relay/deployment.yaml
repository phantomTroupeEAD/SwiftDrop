# ==============================================================================
# Outbox Relay Daemon (Member 8 / Member 9)
# INVARIANT (AGENTS.md §4.4 & ADR-002 §7.2):
# STRICT SINGLETON (replicas: 1) — Autoscaling and replicas > 1 are STRICTLY
# PROHIBITED without distributed leader election. Multiple active relay
# instances cause concurrent lock contention and duplicate message publication.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: outbox-relay
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: message-relay
spec:
  replicas: 1 # STRICT SINGLETON INVARIANT
  strategy:
    type: Recreate # Never run 2 instances during rolling updates
  selector:
    matchLabels:
      app: outbox-relay
  template:
    metadata:
      labels:
        app: outbox-relay
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: outbox-relay
          image: ghcr.io/phantomtroupeead/swiftdrop/messaging:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/relay"]
          ports:
            - containerPort: 8082
              name: metrics
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: RELAY_DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_URL
            - name: METRICS_PORT
              value: "8082"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
