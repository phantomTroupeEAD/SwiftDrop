# ServiceAccounts referenced by outbox-relay.yaml and event-worker.yaml.
# Without these, Kubernetes rejects the pods. Neither needs Kubernetes API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swiftdrop-relay-sa
  namespace: swiftdrop
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swiftdrop-worker-sa
  namespace: swiftdrop
automountServiceAccountToken: false
