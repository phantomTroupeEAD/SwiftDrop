apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: ai-assistant
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: ai-service
    app.kubernetes.io/managed-by: member-10
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-assistant
        app.kubernetes.io/part-of: swiftdrop
        app.kubernetes.io/component: ai-service
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ai-assistant
          image: swiftdrop/ai-assistant:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/entrypoint.sh", "dual"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-api
              containerPort: 8000
              protocol: TCP
            - name: mcp-sse
              containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-assistant-config
            - secretRef:
                name: ai-assistant-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
