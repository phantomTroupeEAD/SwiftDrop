# Path-based routing on ONE domain (ADR-001, matches deploy/gateway/traefik/dynamic-routes.yml).
# No Host() rules: the same manifest works on localhost (k3d), the Azure DNS name or a custom domain.
# Because the SPA and the API share one origin, browsers do not need CORS for normal use;
# the CORS list below only covers the public origin and local testing.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-general
  namespace: swiftdrop
spec:
  rateLimit:
    average: 100
    burst: 50
---
# Public tracking is unauthenticated, so it gets a stricter per-IP limit.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tracking-ratelimit
  namespace: swiftdrop
spec:
  rateLimit:
    average: 30
    burst: 50
    period: 1m
---
# Courier proof-of-delivery photo upload limit (10 MB).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: upload-limit
  namespace: swiftdrop
spec:
  buffering:
    maxRequestBodyBytes: 10485760
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-headers
  namespace: swiftdrop
spec:
  headers:
    accessControlAllowMethods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    accessControlAllowHeaders:
      - "Authorization"
      - "Content-Type"
      - "X-API-Key"
      - "X-Correlation-ID"
      - "Idempotency-Key"
    # No wildcard. Replace the placeholder with the real public origin (Kustomize overlay patch).
    accessControlAllowOriginList:
      - "https://swiftdrop.example.com"
      - "http://localhost"
    accessControlMaxAge: 3600
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: swiftdrop-routes
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: swiftdrop
spec:
  entryPoints:
    - web
  routes:
    # Explicit priorities: the longest, most specific prefix must win over /api/v1 and /.
    # 1. Tracking API (public tracking + SSE streams)
    - match: PathPrefix(`/api/v1/tracking`)
      kind: Rule
      priority: 30
      services:
        - name: tracking-api
          port: 8081
      middlewares:
        - name: tracking-ratelimit
        - name: cors-headers
    # 2. AI Assistant REST API
    - match: PathPrefix(`/api/v1/ai`)
      kind: Rule
      priority: 30
      services:
        - name: ai-assistant
          port: 8000
      middlewares:
        - name: cors-headers
    # 3. FastMCP remote SSE gateway
    - match: PathPrefix(`/mcp`)
      kind: Rule
      priority: 30
      services:
        - name: ai-assistant
          port: 8002
      middlewares:
        - name: cors-headers
    # 4. Core API monolith
    - match: PathPrefix(`/api/v1`)
      kind: Rule
      priority: 20
      services:
        - name: core-api
          port: 8080
      middlewares:
        - name: rate-limit-general
        - name: upload-limit
        - name: cors-headers
    # 5. Frontend SPA (catch-all, lowest priority). Health endpoints are never routed.
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: web
          port: 3000
