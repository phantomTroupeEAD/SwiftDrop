apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-general
  namespace: swiftdrop
spec:
  rateLimit:
    average: 100
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-headers
  namespace: swiftdrop
spec:
  headers:
    accessControlAllowMethods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    accessControlAllowHeaders:
      - "Authorization"
      - "Content-Type"
      - "Idempotency-Key"
      - "X-Correlation-ID"
    accessControlAllowOriginList:
      - "*"
    accessControlMaxAge: 100
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: swiftdrop-routes
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: swiftdrop
spec:
  entryPoints:
    - web
  routes:
    # 1. AI Assistant API
    - match: Host(`api.swiftdrop.local`) && PathPrefix(`/api/v1/ai`)
      kind: Rule
      services:
        - name: ai-assistant
          port: 8000
      middlewares:
        - name: cors-headers
    # 2. Tracking SSE API (Unbuffered streaming)
    - match: Host(`api.swiftdrop.local`) && PathPrefix(`/api/v1/tracking`)
      kind: Rule
      services:
        - name: tracking-api
          port: 8081
      middlewares:
        - name: cors-headers
    # 3. Core API Monolith
    - match: Host(`api.swiftdrop.local`) && PathPrefix(`/api/v1`)
      kind: Rule
      services:
        - name: core-api
          port: 8080
      middlewares:
        - name: rate-limit-general
        - name: cors-headers
    # 4. Frontend Web SPA
    - match: Host(`swiftdrop.local`) || Host(`portal.swiftdrop.local`)
      kind: Rule
      services:
        - name: web
          port: 3000
