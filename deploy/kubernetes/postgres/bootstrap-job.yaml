apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-bootstrap-script
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: database-bootstrap
data:
  bootstrap-roles.sql: |
    -- SwiftDrop Database Role Bootstrap (Agreement D6 & D7), Kubernetes version.
    -- Run by the postgres superuser before the first migration. Idempotent: safe on every apply.
    -- NO passwords in this file: they come from the postgres-secrets Secret as psql variables
    -- (:'migrator_pw' etc.). The Job runs it with psql -1, so it is all-or-nothing: once
    -- swiftdrop_migrator can log in, every grant below has committed (the migrate Job waits for that).
    -- Migrations GRANT table rights to relay/worker/reconciler only IF those roles exist,
    -- so this must finish before core-api-migrate runs.
    -- Compose uses deploy/postgres/bootstrap-roles.sql (fixed local-only passwords).

    -- Extensions need the superuser; migrations only run CREATE EXTENSION IF NOT EXISTS (then a no-op).
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    -- Create missing roles (without a password), then always (re)set the password from the Secret.
    -- Re-applying with new Secret values rotates the passwords.
    SELECT 'CREATE ROLE swiftdrop_migrator LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'swiftdrop_migrator') \gexec
    SELECT 'CREATE ROLE swiftdrop_app LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'swiftdrop_app') \gexec
    SELECT 'CREATE ROLE swiftdrop_tracking_ro LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'swiftdrop_tracking_ro') \gexec
    SELECT 'CREATE ROLE swiftdrop_relay LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'swiftdrop_relay') \gexec
    SELECT 'CREATE ROLE swiftdrop_worker LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'swiftdrop_worker') \gexec
    SELECT 'CREATE ROLE swiftdrop_reconciler LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'swiftdrop_reconciler') \gexec

    ALTER ROLE swiftdrop_migrator   WITH LOGIN PASSWORD :'migrator_pw';
    ALTER ROLE swiftdrop_app        WITH LOGIN PASSWORD :'app_pw';
    ALTER ROLE swiftdrop_tracking_ro WITH LOGIN PASSWORD :'tracking_pw';
    ALTER ROLE swiftdrop_relay      WITH LOGIN PASSWORD :'relay_pw';
    ALTER ROLE swiftdrop_worker     WITH LOGIN PASSWORD :'worker_pw';
    ALTER ROLE swiftdrop_reconciler WITH LOGIN PASSWORD :'reconciler_pw';

    -- Transfer public schema ownership to swiftdrop_migrator
    ALTER SCHEMA public OWNER TO swiftdrop_migrator;

    -- Grant schema usage to application roles
    GRANT USAGE ON SCHEMA public
      TO swiftdrop_app, swiftdrop_tracking_ro, swiftdrop_relay, swiftdrop_worker, swiftdrop_reconciler;

    -- Set default table & sequence privileges for swiftdrop_app on future migrator-created tables
    ALTER DEFAULT PRIVILEGES FOR ROLE swiftdrop_migrator IN SCHEMA public
      GRANT SELECT, INSERT, UPDATE ON TABLES TO swiftdrop_app;

    ALTER DEFAULT PRIVILEGES FOR ROLE swiftdrop_migrator IN SCHEMA public
      GRANT USAGE, SELECT ON SEQUENCES TO swiftdrop_app;

    -- Set default table & sequence privileges for swiftdrop_tracking_ro (read-only)
    ALTER DEFAULT PRIVILEGES FOR ROLE swiftdrop_migrator IN SCHEMA public
      GRANT SELECT ON TABLES TO swiftdrop_tracking_ro;

    ALTER DEFAULT PRIVILEGES FOR ROLE swiftdrop_migrator IN SCHEMA public
      GRANT USAGE, SELECT ON SEQUENCES TO swiftdrop_tracking_ro;

    -- Per-role execution timeouts & read-only enforcement (Agreement D9)
    ALTER ROLE swiftdrop_app         SET statement_timeout = '5s';
    ALTER ROLE swiftdrop_app         SET lock_timeout = '2s';
    ALTER ROLE swiftdrop_tracking_ro SET statement_timeout = '3s';
    ALTER ROLE swiftdrop_tracking_ro SET default_transaction_read_only = on;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap-roles
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: swiftdrop
    app.kubernetes.io/component: database-bootstrap
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: postgres-bootstrap-roles
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "Waiting for PostgreSQL primary to become ready..."
                sleep 2
              done
              echo "Applying role bootstrap script (single transaction)..."
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -v ON_ERROR_STOP=1 --single-transaction \
                -v migrator_pw="$MIGRATOR_PASSWORD" -v app_pw="$APP_PASSWORD" -v tracking_pw="$TRACKING_PASSWORD" \
                -v relay_pw="$RELAY_PASSWORD" -v worker_pw="$WORKER_PASSWORD" -v reconciler_pw="$RECONCILER_PASSWORD" \
                -f /scripts/bootstrap-roles.sql
              echo "Database roles successfully bootstrapped."
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
            # Per-role passwords. Each must match the password inside that role's *_DATABASE_URL.
            - name: MIGRATOR_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secrets, key: MIGRATOR_PASSWORD}}
            - name: APP_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secrets, key: APP_PASSWORD}}
            - name: TRACKING_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secrets, key: TRACKING_PASSWORD}}
            - name: RELAY_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secrets, key: RELAY_PASSWORD}}
            - name: WORKER_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secrets, key: WORKER_PASSWORD}}
            - name: RECONCILER_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secrets, key: RECONCILER_PASSWORD}}
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: script-vol
          configMap:
            name: postgres-bootstrap-script
