# Traefik Dynamic Route & Middleware Configuration
# SwiftDrop Edge Proxy Routing Rules

http:
  routers:
    # 1. Tracking API (SSE Streams & Public Tracking)
    tracking-router:
      rule: "PathPrefix(`/api/v1/tracking`)"
      entryPoints:
        - "web"
      service: "tracking-service"
      middlewares:
        - "cors-middleware"
        - "tracking-ratelimit"

    # 2. AI Assistant REST API & Chat Streaming
    ai-router:
      rule: "PathPrefix(`/api/v1/ai`)"
      entryPoints:
        - "web"
      service: "ai-service"
      middlewares:
        - "cors-middleware"

    # 3. FastMCP Remote SSE Gateway (:8002)
    ai-mcp-router:
      rule: "PathPrefix(`/mcp`)"
      entryPoints:
        - "web"
      service: "ai-mcp-service"
      middlewares:
        - "cors-middleware"

    # 4. Core API (Modular Monolith)
    core-api-router:
      rule: "PathPrefix(`/api/v1`)"
      entryPoints:
        - "web"
      service: "core-api-service"
      middlewares:
        - "cors-middleware"
        - "upload-limit-middleware"

    # 4. Frontend Single-Page Application (SPA)
    frontend-router:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - "web"
      service: "frontend-service"

  services:
    core-api-service:
      loadBalancer:
        servers:
          - url: "http://core-api:8080"

    tracking-service:
      loadBalancer:
        servers:
          - url: "http://tracking-api:8081"

    ai-service:
      loadBalancer:
        servers:
          - url: "http://ai-assistant:8000"

    ai-mcp-service:
      loadBalancer:
        servers:
          - url: "http://ai-assistant:8002"

    frontend-service:
      loadBalancer:
        servers:
          - url: "http://web:3000"

  middlewares:
    # CORS Headers for Frontend & Merchant API Integration
    cors-middleware:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-API-Key"
          - "X-Tenant-ID"
          - "Idempotency-Key"
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost:5173"
        accessControlMaxAge: 3600

    # Public Tracking Rate Limiter (Token bucket per client IP)
    tracking-ratelimit:
      rateLimit:
        average: 30
        burst: 50
        period: "1m"

    # Courier POD Photo Upload Size Limiter (Max 10 MB)
    upload-limit-middleware:
      buffering:
        maxRequestBodyBytes: 10485760 # 10 MB
