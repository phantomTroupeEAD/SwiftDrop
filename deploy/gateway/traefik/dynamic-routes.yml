# Traefik Dynamic Route & Middleware Configuration (SwiftDrop Edge Proxy)
# Backend hosts are Docker Compose service names. kubernetes/ holds the same rules as CRDs;
# scripts/gateway_parity.py fails if a middleware or servers transport differs.
# Each hardening rule is tagged with the gateway check that proves it (GS-xx).
# The gateway does NOT check tokens or roles. Core API does that (security-notes, rule 2).

http:
  routers:
    # 1. Tracking API. Exact prefix so /api/v1/trackingX is not caught (GS-03).
    tracking-router:
      rule: "Path(`/api/v1/tracking`) || PathPrefix(`/api/v1/tracking/`)"
      entryPoints: ["web"]
      service: "tracking-service"
      middlewares: ["strip-identity-headers", "security-headers", "cors-middleware", "tracking-ratelimit"]

    # 1b. SSE streams, public and signed-in: also cap open connections per visitor
    #     (5 per IP) (GS-09). No buffering middleware on any stream.
    tracking-stream-router:
      rule: "PathRegexp(`^/api/v1/tracking/(public/)?[^/]+/stream$`)"
      priority: 100   # must beat tracking-router, whose rule text is longer (Traefik ranks by rule length)
      entryPoints: ["web"]
      service: "tracking-service"
      middlewares: ["strip-identity-headers", "security-headers", "cors-middleware", "tracking-ratelimit", "stream-inflight"]

    # 2. AI Assistant REST API (GS-03 exact prefix). 10 per minute per visitor, burst 2 (GS-20).
    ai-router:
      rule: "Path(`/api/v1/ai`) || PathPrefix(`/api/v1/ai/`)"
      entryPoints: ["web"]
      service: "ai-service"
      middlewares: ["strip-identity-headers", "security-headers", "cors-middleware", "ai-ratelimit", "json-limit"]

    # 2b. FastMCP remote SSE server (:8002): GET /mcp is a stream, POST /mcp/messages/ carries
    #     tool calls. No buffering (json-limit buffers); open-stream cap instead.
    ai-mcp-router:
      rule: "Path(`/mcp`) || PathPrefix(`/mcp/`)"
      entryPoints: ["web"]
      service: "ai-mcp-service"
      middlewares: ["strip-identity-headers", "security-headers", "cors-middleware", "ai-ratelimit", "stream-inflight"]

    # 3a. Login: brute-force guard, 5 per minute per visitor, burst 3 (security-notes 3) (GS-06).
    login-router:
      rule: "Path(`/api/v1/auth/login`)"
      entryPoints: ["web"]
      service: "core-api-service"
      middlewares: ["strip-identity-headers", "security-headers", "cors-middleware", "login-ratelimit", "json-limit"]

    # 3b. Proof photo upload only (Member 3: multipart field "photo"): 10 MB (GS-08).
    upload-router:
      rule: "PathRegexp(`^/api/v1/deliveries/[^/]+/proof-photo$`)"
      entryPoints: ["web"]
      service: "core-api-service"
      middlewares: ["strip-identity-headers", "security-headers", "cors-middleware", "upload-limit-middleware"]

    # 3c. Merchant API (X-API-Key callers): 120 per minute per visitor, burst 20 (GS-21).
    #     Per-key limits are enforced by Member 4's module; the gateway cannot read keys.
    merchant-api-router:
      rule: "PathPrefix(`/api/v1/merchant/`)"
      entryPoints: ["web"]
      service: "core-api-service"
      middlewares: ["strip-identity-headers", "security-headers", "cors-middleware", "merchant-ratelimit", "json-limit"]

    # 3d. Everything else in v1: JSON bodies up to 1 MB (SEC-006) (GS-07).
    core-api-router:
      rule: "PathPrefix(`/api/v1`)"
      entryPoints: ["web"]
      service: "core-api-service"
      middlewares: ["strip-identity-headers", "security-headers", "cors-middleware", "json-limit"]

    # 3e. Unknown API versions (/api/v2, /api/x) go to core-api, which answers 404 JSON,
    #     instead of the SPA answering 200 HTML (GS-04).
    api-catchall-router:
      rule: "PathPrefix(`/api`)"
      priority: 2
      entryPoints: ["web"]
      service: "core-api-service"
      middlewares: ["strip-identity-headers", "security-headers", "json-limit"]

    # 4. Frontend Single-Page Application (SPA).
    frontend-router:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints: ["web"]
      service: "frontend-service"
      middlewares: ["security-headers", "spa-csp"]

    # 5. Dashboard, internal entry point only (GS-12).
    dashboard-router:
      rule: "PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      entryPoints: ["traefik"]
      service: "api@internal"

  services:
    core-api-service:
      loadBalancer:
        serversTransport: "backend-transport"
        servers: [{url: "http://core-api:8080"}]
    tracking-service:
      loadBalancer:
        serversTransport: "stream-transport"
        servers: [{url: "http://tracking-api:8081"}]
    ai-service:
      loadBalancer:
        serversTransport: "ai-transport"
        servers: [{url: "http://ai-assistant:8000"}]
    ai-mcp-service:
      loadBalancer:
        serversTransport: "ai-transport"
        servers: [{url: "http://ai-assistant:8002"}]
    frontend-service:
      loadBalancer:
        serversTransport: "backend-transport"
        servers: [{url: "http://web:3000"}]

  # Dependency timeouts (GS-13, GS-14). No retry middleware anywhere: a write must never be
  # sent twice by the gateway. The client retries with the same Idempotency-Key.
  serversTransports:
    backend-transport:
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 30s
        idleConnTimeout: 90s
    stream-transport:
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 10s   # SSE sends headers at once; the body may stay open for hours
        idleConnTimeout: 90s
    ai-transport:
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 60s   # LLM answers are slow [TBD with AI owner]
        idleConnTimeout: 90s

  middlewares:
    # Identity comes only from the token, checked by Core API. Remove look-alike headers
    # a client might send, as defence in depth (GS-10). Empty value = Traefik removes it.
    strip-identity-headers:
      headers:
        customRequestHeaders:
          X-User-ID: ""
          X-User-Role: ""
          X-Tenant-ID: ""
          X-Merchant-ID: ""
          X-Forwarded-User: ""

    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000          # sent only over HTTPS
        stsIncludeSubdomains: true
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""

    spa-csp:
      headers:
        contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # CORS exactly as security-notes section 4 (GS-11). X-Tenant-ID is not allowed:
    # the client never sends it, the tenant comes from the token.
    # Local origins here; kubernetes/middlewares.yaml has the production origins.
    cors-middleware:
      headers:
        accessControlAllowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        accessControlAllowHeaders: ["Authorization", "Content-Type", "X-API-Key", "Idempotency-Key", "X-Request-ID"]
        accessControlExposeHeaders: ["X-Request-ID", "Content-Length"]
        accessControlAllowCredentials: true
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://127.0.0.1:3000"
        accessControlMaxAge: 86400
        addVaryHeader: true

    # Per-visitor buckets. Behind Cloudflare the real client is the right-most X-Forwarded-For
    # entry (depth 1). If another proxy is added in front of Traefik, depth must change.
    tracking-ratelimit:
      rateLimit:
        average: 30
        burst: 10                     # security-notes value
        period: "1m"
        sourceCriterion: {ipStrategy: {depth: 1}}

    login-ratelimit:
      rateLimit:
        average: 5
        burst: 3
        period: "1m"
        sourceCriterion: {ipStrategy: {depth: 1}}

    ai-ratelimit:
      rateLimit:
        average: 10
        burst: 2
        period: "1m"
        sourceCriterion: {ipStrategy: {depth: 1}}

    merchant-ratelimit:
      rateLimit:
        average: 120
        burst: 20
        period: "1m"
        sourceCriterion: {ipStrategy: {depth: 1}}

    stream-inflight:
      inFlightReq:
        amount: 5
        sourceCriterion: {ipStrategy: {depth: 1}}

    json-limit:
      buffering:
        maxRequestBodyBytes: 1048576   # 1 MB (SEC-006)

    upload-limit-middleware:
      buffering:
        maxRequestBodyBytes: 10485760  # 10 MB
